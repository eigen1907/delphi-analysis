[project]
name = "delphi-analysis"
version = "0.1.0"
description = "DELPHI NanoAOD analysis and BDT studies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "awkward",
    "delphi-metadata",
    "hist",
    "joblib",
    "matplotlib",
    "mplhep",
    "numpy",
    "scipy",
    "scikit-learn",
    "uproot",
    "xgboost",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
delphi-metadata = { git = "https://gitlab.cern.ch/liko/delphi-metadata.git", subdirectory = "python", rev = "6db7388ecf756137f30f54ad87ade81c68409820" }
