[project]
name = "delphi-analysis"
version = "0.1.0"
description = "DELPHI NanoAOD analysis and BDT studies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "awkward",
    "hist",
    "joblib",
    "matplotlib",
    "mplhep",
    "numpy",
    "scipy",
    "scikit-learn",
    "uproot",
    "xgboost",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
